name: SCA Full Pipeline - Sign Language Detection (Linux)

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.py'
      - '**/requirements*.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/sca-full-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: sign-language-detection
  PROJECT_VERSION: "1.0.0"
  CAPYCLI_DIR: capycli-fork
  REPORT_DIR: per-dependency-reports
  SOURCE_DIR: sources

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install cdxgen
        run: npm install --global @cyclonedx/cdxgen

      - name: Generate and validate CycloneDX SBOM
        run: |
          set -euo pipefail
          cdxgen --recursive --output sbom.json --spec-version 1.7 --format json
          test -s sbom.json
          test "$(jq -r '.specVersion // empty' sbom.json)" = "1.7"
          jq '
            (.components | map(select(
              (.group // "") != "actions" and
              ((.name // "") | test("^actions/") | not) and
              ((.purl // "") | startswith("pkg:github/") | not)
            ))) as $components |
            ($components | map(."bom-ref")) as $refs |
            .components = $components |
            if .dependencies then
              .dependencies |= map(select(.ref as $ref | $refs | index($ref) != null))
            else . end
          ' sbom.json > sbom.json.tmp
          mv sbom.json.tmp sbom.json
          echo "SBOM contains $(jq '.components | length' sbom.json) components"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 7

  map-and-create:
    name: Map and create in SW360
    runs-on: [self-hosted, linux]
    needs: generate-sbom
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - uses: actions/download-artifact@v4
        with:
          name: sbom

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add source archive references
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          source_comment = "source archive (download location)"

          def purl_parts(purl):
              if not isinstance(purl, str) or not purl.startswith("pkg:"):
                  return None, None, None
              try:
                  package_type, remainder = purl[4:].split("/", 1)
                  name, version = remainder.split("?", 1)[0].rsplit("@", 1)
                  return package_type, urllib.parse.unquote(name), urllib.parse.unquote(version)
              except ValueError:
                  return None, None, None

          def get_json(url):
              request = urllib.request.Request(url, headers={"User-Agent": "sign-language-sca/1.0"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def source_url(component):
              package_type, name, version = purl_parts(component.get("purl"))
              if package_type == "pypi":
                  metadata = get_json(
                      f"https://pypi.org/pypi/{urllib.parse.quote(name)}/{urllib.parse.quote(version)}/json"
                  )
                  files = metadata.get("urls", [])
                  selected = next((item for item in files if item.get("packagetype") == "sdist"), None)
                  selected = selected or next((item for item in files if item.get("packagetype") == "bdist_wheel"), None)
                  return selected.get("url") if selected else None
              if package_type == "npm":
                  archive_name = name.rsplit("/", 1)[-1]
                  return f"https://registry.npmjs.org/{urllib.parse.quote(name, safe='@/')}/-/{archive_name}-{urllib.parse.quote(version)}.tgz"
              if package_type == "maven":
                  namespace, artifact = name.rsplit("/", 1)
                  return f"https://repo1.maven.org/maven2/{namespace.replace('.', '/')}/{artifact}/{version}/{artifact}-{version}-sources.jar"
              return None

          path = Path("sbom.json")
          sbom = json.loads(path.read_text(encoding="utf-8"))
          failures = []
          for component in sbom.get("components", []):
              url = source_url(component)
              if not url:
                  failures.append(component.get("purl") or component.get("name", "unknown"))
                  continue
              references = [reference for reference in component.get("externalReferences", []) if reference.get("comment") != source_comment]
              references.append({"type": "distribution", "comment": source_comment, "url": url})
              component["externalReferences"] = references
          if failures:
              raise SystemExit("Unable to resolve source archives for:\n  - " + "\n  - ".join(failures))
          path.write_text(json.dumps(sbom, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - name: Install CapyCLI
        run: pip install . --force-reinstall
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Map and bootstrap SW360 components
        run: |
          set +e
          python -m capycli bom map -i sbom.json -url "${{ vars.SW360_URL }}" -t "${{ secrets.SW360_TOKEN }}" -mr mapping-result.json -o mapped-sbom.json --matchmode full-search,all-versions -v
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 80 ] && [ "$result" -ne 81 ]; then exit "$result"; fi
          python -m capycli bom createcomponents -i mapped-sbom.json -o created-sbom.json -url "${{ vars.SW360_URL }}" -t "${{ secrets.SW360_TOKEN }}" -X -v
          component_count=$(jq '.components | length' created-sbom.json)
          id_count=$(jq '[.components[] | select(.properties[]?.name == "siemens:sw360Id")] | length' created-sbom.json)
          test "$component_count" -gt 0
          test "$id_count" -eq "$component_count"

      - name: Create or update SW360 project
        run: |
          python -m capycli project create -i created-sbom.json -url "${{ vars.SW360_URL }}" -t "${{ secrets.SW360_TOKEN }}" -name "${{ env.PROJECT_NAME }}" -version "${{ env.PROJECT_VERSION }}" -v
          python -m capycli project find -name "${{ env.PROJECT_NAME }}" -version "${{ env.PROJECT_VERSION }}" -url "${{ vars.SW360_URL }}" -t "${{ secrets.SW360_TOKEN }}" --id-only > project-id.txt
          test -s project-id.txt

      - uses: actions/upload-artifact@v4
        with:
          name: created-sbom
          path: created-sbom.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: project-id
          path: project-id.txt
          if-no-files-found: error
          retention-days: 7

  filter-by-clearing-state:
    name: Filter by clearing state
    runs-on: [self-hosted, linux]
    needs: map-and-create
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: created-sbom

      - name: Retain only releases requiring scans
        env:
          SW360_URL: ${{ vars.SW360_URL }}
          SW360_TOKEN: ${{ secrets.SW360_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          sbom = json.loads(Path("created-sbom.json").read_text(encoding="utf-8"))
          included = []
          for component in sbom.get("components", []):
              release_id = next((item.get("value") for item in component.get("properties", []) if item.get("name") == "siemens:sw360Id"), None)
              if not release_id:
                  raise SystemExit(f"Missing SW360 ID for {component.get('name')}")
              request = urllib.request.Request(
                  f"{os.environ['SW360_URL'].rstrip('/')}/resource/api/releases/{release_id}",
                  headers={"Authorization": f"Token {os.environ['SW360_TOKEN']}"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      state = json.load(response).get("clearingState") or "UNKNOWN"
              except OSError as error:
                  raise SystemExit(f"Could not query SW360 release {release_id}: {error}")
              properties = [item for item in component.get("properties", []) if item.get("name") != "siemens:clearingState"]
              properties.append({"name": "siemens:clearingState", "value": state})
              component["properties"] = properties
              if state not in {"REPORT_AVAILABLE", "APPROVED"}:
                  included.append(component)
          Path("enriched-sbom.json").write_text(json.dumps(sbom, indent=2) + "\n", encoding="utf-8")
          filtered = dict(sbom)
          filtered["components"] = included
          refs = {component.get("bom-ref") for component in included}
          if filtered.get("dependencies"):
              filtered["dependencies"] = [dependency for dependency in filtered["dependencies"] if dependency.get("ref") in refs]
          Path("filtered-sbom.json").write_text(json.dumps(filtered, indent=2) + "\n", encoding="utf-8")
          print(f"Components requiring scan: {len(included)}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: enriched-sbom
          path: enriched-sbom.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: filtered-sbom
          path: filtered-sbom.json
          if-no-files-found: error
          retention-days: 7

  scan-fossology:
    name: Download and FOSSology scan
    runs-on: [self-hosted, linux]
    needs: filter-by-clearing-state
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: filtered-sbom

      - name: Determine whether scanning is required
        id: scan-needed
        run: |
          test "$(jq '.components | length' filtered-sbom.json)" -gt 0 && echo "required=true" >> "$GITHUB_OUTPUT" || echo "required=false" >> "$GITHUB_OUTPUT"
          echo '[]' > source-manifest.json

      - name: Verify runner prerequisites
        if: steps.scan-needed.outputs.required == 'true'
        run: |
          set -euo pipefail
          for command_name in jq curl python3 docker; do command -v "$command_name" >/dev/null; done
          docker info >/dev/null
          docker image inspect fossology/fossology:scanner >/dev/null 2>&1 || docker pull fossology/fossology:scanner

      - name: Download source archives
        if: steps.scan-needed.outputs.required == 'true'
        run: |
          python3 - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          sbom = json.loads(Path("filtered-sbom.json").read_text(encoding="utf-8"))
          source_dir = Path("sources")
          source_dir.mkdir()
          manifest = []
          for component in sbom["components"]:
              release_id = next(item["value"] for item in component["properties"] if item["name"] == "siemens:sw360Id")
              url = next(reference["url"] for reference in component["externalReferences"] if reference.get("comment") == "source archive (download location)")
              filename = Path(unquote(urlparse(url).path)).name
              if not filename: raise SystemExit(f"No source filename for {component['name']}")
              archive = source_dir / filename
              subprocess.run(["curl", "--fail", "--location", "--retry", "3", url, "--output", str(archive)], check=True)
              manifest.append({"name": component["name"], "version": component["version"], "release_id": release_id, "source_filename": filename})
          Path("source-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Run FOSSology analysis
        if: steps.scan-needed.outputs.required == 'true'
        uses: shatakshisgtiwari-jpg/fossology-action@feat/action/per-dependency-report
        with:
          scan_mode: scan-only-deps
          scanners: ojo copyright nomos
          report_format: SPDX_JSON
          sbom_path: filtered-sbom.json
          per_dependency_report: "true"
          report_dir: ${{ env.REPORT_DIR }}

      - name: Verify FOSSology output
        if: steps.scan-needed.outputs.required == 'true'
        run: |
          test -s results/sbom_spdx.json
          jq empty results/sbom_spdx.json
          test "$(find "${{ env.REPORT_DIR }}" -name '*.spdx.json' -type f | wc -l)" -gt 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-artifacts
          path: |
            results/
            ${{ env.REPORT_DIR }}/
            ${{ env.SOURCE_DIR }}/
            source-manifest.json
          if-no-files-found: warn
          retention-days: 7

  upload-to-sw360:
    name: Upload to SW360
    runs-on: [self-hosted, linux]
    needs: scan-fossology
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scan-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: enriched-sbom

      - uses: actions/download-artifact@v4
        with:
          name: filtered-sbom

      - uses: actions/download-artifact@v4
        with:
          name: project-id

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI
        run: pip install . --force-reinstall
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Create releases and attach source files
        run: |
          count=$(jq '.components | length' filtered-sbom.json)
          if [ "$count" -gt 0 ]; then
            python -m capycli bom createreleases -i filtered-sbom.json -o processed-sbom.json -url "${{ vars.SW360_URL }}" -t "${{ secrets.SW360_TOKEN }}" -source "${{ env.SOURCE_DIR }}" -X -v
          else
            cp filtered-sbom.json processed-sbom.json
          fi

      - name: Assemble complete final SBOM
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          complete = json.loads(Path("enriched-sbom.json").read_text(encoding="utf-8"))
          processed = json.loads(Path("processed-sbom.json").read_text(encoding="utf-8"))

          def key(component):
              return component.get("bom-ref") or (component.get("name"), component.get("version"))

          def merged_properties(original, updated):
              properties = {item.get("name"): item for item in original if item.get("name")}
              properties.update({item.get("name"): item for item in updated if item.get("name")})
              return list(properties.values())

          processed_by_key = {key(component): component for component in processed.get("components", [])}
          components = []
          for component in complete.get("components", []):
              updated = processed_by_key.get(key(component))
              if not updated:
                  components.append(component)
                  continue
              merged = dict(component)
              merged.update(updated)
              merged["properties"] = merged_properties(component.get("properties", []), updated.get("properties", []))
              components.append(merged)
          complete["components"] = components
          Path("complete-sbom.json").write_text(json.dumps(complete, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload component license reports
        run: |
          count=$(jq '.components | length' filtered-sbom.json)
          reports=$(find "${{ env.REPORT_DIR }}" -name '*.spdx.json' -type f 2>/dev/null | wc -l || true)
          if [ "$count" -gt 0 ] && [ "$reports" -eq 0 ]; then echo "No scan reports found"; exit 1; fi
          if [ "$reports" -gt 0 ]; then
            python -m capycli bom uploadreports -i complete-sbom.json --report-dir "${{ env.REPORT_DIR }}" --filetype COMPONENT_LICENSE_INFO_XML --comment "FOSSology SPDX scan - ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}" -url "${{ vars.SW360_URL }}" -t "${{ secrets.SW360_TOKEN }}" -o final-sbom.json -X -v
          else
            cp complete-sbom.json final-sbom.json
          fi

      - name: Mark scanned releases REPORT_AVAILABLE
        env:
          SW360_URL: ${{ vars.SW360_URL }}
          SW360_TOKEN: ${{ secrets.SW360_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          filtered = json.loads(Path("filtered-sbom.json").read_text(encoding="utf-8"))
          final = json.loads(Path("final-sbom.json").read_text(encoding="utf-8"))
          release_ids = {
              next((item.get("value") for item in component.get("properties", []) if item.get("name") == "siemens:sw360Id"), None)
              for component in filtered.get("components", [])
          }
          release_ids.discard(None)
          for release_id in release_ids:
              request = urllib.request.Request(
                  f"{os.environ['SW360_URL'].rstrip('/')}/resource/api/releases/{release_id}",
                  data=b'{"clearingState":"REPORT_AVAILABLE"}',
                  method="PATCH",
                  headers={
                      "Authorization": f"Token {os.environ['SW360_TOKEN']}",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status not in {200, 204}:
                      raise SystemExit(f"Could not update release {release_id}")
          for component in final.get("components", []):
              release_id = next((item.get("value") for item in component.get("properties", []) if item.get("name") == "siemens:sw360Id"), None)
              if release_id in release_ids:
                  properties = [item for item in component.get("properties", []) if item.get("name") != "siemens:clearingState"]
                  properties.append({"name": "siemens:clearingState", "value": "REPORT_AVAILABLE"})
                  component["properties"] = properties
          Path("final-sbom.json").write_text(json.dumps(final, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish final SBOM
        uses: actions/upload-artifact@v4
        with:
          name: final-sbom
          path: final-sbom.json
          if-no-files-found: error
          retention-days: 7

  validate-pipeline:
    name: Validate pipeline
    runs-on: [self-hosted, linux]
    needs: upload-to-sw360
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: final-sbom

      - uses: actions/download-artifact@v4
        with:
          name: project-id

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI and validate SW360 prerequisites
        run: |
          pip install . --force-reinstall
          project_id=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/project-id.txt")
          test -n "$project_id"
          python -m capycli project prerequisites -i "$GITHUB_WORKSPACE/final-sbom.json" -id "$project_id" -url "${{ vars.SW360_URL }}" -t "${{ secrets.SW360_TOKEN }}" --check-reports --forceerror -v
        working-directory: ${{ env.CAPYCLI_DIR }}